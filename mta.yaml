_schema-version: '3.3'
ID: databricks-connector
version: 1.0.0
description: BTP proxy/connector exposing a Databricks table (via Delta Sharing) to SAP Cloud Integration
parameters:
  enable-parallel-deployments: true

modules:
  - name: databricks-connector-xs
    type: python
    path: .
    parameters:
      buildpack: python_buildpack
      memory: 1024M
      disk-quota: 1024M
      command: gunicorn -k uvicorn.workers.UvicornWorker -w 2 --bind 0.0.0.0:$PORT app.main:app
    requires:
      - name: databricks-connector-credentials
      - name: databricks-connector-xsuaa
      # Uncomment if Databricks is only reachable via an on-premise/private
      # network route through the Cloud Connector:
      # - name: databricks-connector-connectivity
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

resources:
  # Create this user-provided service BEFORE deploying, e.g.:
  #   cf create-user-provided-service databricks-connector-credentials -p \
  #     '{"DELTA_SHARING_ENDPOINT":"https://<workspace-host>/api/2.0/delta-sharing/metastores/<metastore-id>/recipients/<recipient-id>"}'
  # Databricks access tokens are supplied per request by CPI in the
  # Databricks-Bearer header; they are not stored in this service.
  - name: databricks-connector-credentials
    type: org.cloudfoundry.existing-service

  # Create this XSUAA service using xs-security.json before deploying.
  - name: databricks-connector-xsuaa
    type: org.cloudfoundry.existing-service

  # - name: databricks-connector-connectivity
  #   type: org.cloudfoundry.managed-service
  #   parameters:
  #     service: connectivity
  #     service-plan: lite
