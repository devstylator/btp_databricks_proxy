_schema-version: '3.3'
ID: databricks-connector
version: 1.0.0
description: BTP proxy/connector exposing a Databricks table (via Delta Sharing) to SAP Cloud Integration
parameters:
  enable-parallel-deployments: true

modules:
  - name: databricks-connector-srv
    type: python
    path: .
    parameters:
      buildpack: python_buildpack
      memory: 1024M
      disk-quota: 1024M
      command: gunicorn -k uvicorn.workers.UvicornWorker -w 2 --bind 0.0.0.0:$PORT app.main:app
    requires:
      - name: databricks-connector-xsuaa
      - name: databricks-connector-credentials
      # Uncomment if Databricks is only reachable via an on-premise/private
      # network route through the Cloud Connector:
      # - name: databricks-connector-connectivity
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

resources:
  - name: databricks-connector-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: databricks-connector-${org}-${space}

  # Create this user-provided service BEFORE deploying the MTA, e.g.:
  #   cf create-user-provided-service databricks-connector-credentials -p \
  #     '{"DELTA_SHARING_ENDPOINT":"https://<workspace-host>/api/2.0/delta-sharing/metastores/<metastore-id>/recipients/<recipient-id>","AZURE_TOKEN_ENDPOINT":"https://login.microsoftonline.com/<tenant-id>/oauth2/v2.0/token","AZURE_CLIENT_ID":"...","AZURE_CLIENT_SECRET":"...","AZURE_SCOPE":"<client-id>/.default"}'
  # Never commit the client secret to this file or to git.
  - name: databricks-connector-credentials
    type: org.cloudfoundry.existing-service

  # - name: databricks-connector-connectivity
  #   type: org.cloudfoundry.managed-service
  #   parameters:
  #     service: connectivity
  #     service-plan: lite
